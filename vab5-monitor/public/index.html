<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.webmanifest"><title>VAB 5 Monitor</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;margin:0;background:#f3f4f6;color:#111827}main{max-width:760px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}small{letter-spacing:.12em;color:#6b7280}h1{margin:.2rem 0;font-size:2rem}header p{margin:0;color:#6b7280}button,input,select{font:inherit}#refresh{border:0;background:#fff;border-radius:999px;font-size:1.5rem;width:44px;height:44px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 0}.cards article,.settings{background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 30px #0000000b}.route,.meta{color:#6b7280}.time{font-size:2.5rem;font-weight:700;margin:10px 0}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#e5e7eb}.badge.ON_TIME{background:#dcfce7}.badge.DELAYED{background:#fef3c7}.badge.CANCELLED{background:#fee2e2}.badge.NO_REALTIME{background:#e5e7eb}.meta{margin-top:10px;font-size:.85rem}.settings{display:grid;gap:12px}.settings label{display:flex;justify-content:space-between;gap:12px;align-items:center}.window{border-top:1px solid #e5e7eb;padding-top:14px;margin-top:4px}.days{display:flex;gap:6px;margin-top:8px}.day{border:1px solid #d1d5db;background:#fff;border-radius:10px;padding:6px 9px}.day.sel{background:#111827;color:#fff}.settings>button{padding:12px 16px;border:0;border-radius:12px;background:#111827;color:#fff}.settings>#push{background:#2563eb}footer{color:#6b7280;font-size:.8rem;padding:20px 4px}@media(max-width:650px){main{padding:16px}.cards{grid-template-columns:1fr}.settings label{align-items:flex-start;flex-direction:column}.time{font-size:2.1rem}}</style></head><body><main><header><div><small>AIRPORT BUS MONITOR</small><h1>VAB 5 Monitor</h1><p>Praterstern ↔ Flughafen Wien</p></div><button id="refresh">↻</button></header><section class="cards"><article><b>Morgens</b><div id="out">Lade…</div></article><article><b>Abends</b><div id="in">Lade…</div></article></section><section class="settings"><h2>Benachrichtigungen</h2><label>Abweichung melden ab <input id="min" type="number" min="0" max="120"> Minuten</label><label>Prüfintervall <select id="poll"><option value="60">1 Minute</option><option value="120">2 Minuten</option><option value="300">5 Minuten</option><option value="600">10 Minuten</option></select></label><label><input id="change" type="checkbox"> Nur bei Statusänderung</label><div id="windows"></div><button id="save">Einstellungen speichern</button><button id="push">Push aktivieren</button></section><footer>Live-Daten: ÖBB HAFAS · VAB 5</footer></main><script src="/app.js"></script></body></html>
