name: Deploy VAB5 Monitor (Cloudflare Workers)

on:
  push:
    branches: [cloudflare-vab5-pwa]
    paths:
      - 'cloudflare-vab5-pwa/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-vab5-pwa
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Resolve or create D1 database
        shell: bash
        run: |
          set -euo pipefail
          DB_ID="$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);const x=a.find(x=>x.name==="vab5-monitor");if(x)process.stdout.write(x.uuid||x.id||"")})')"
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create vab5-monitor > /tmp/d1-create.txt
            DB_ID="$(grep -Eo '([0-9a-f]{32}|[0-9a-f-]{36})' /tmp/d1-create.txt | tail -1)"
          fi
          test -n "$DB_ID"
          sed "s/REPLACE_WITH_D1_DATABASE_ID/$DB_ID/g" wrangler.jsonc > wrangler.deploy.jsonc
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply vab5-monitor --remote --config wrangler.deploy.jsonc
      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.deploy.jsonc
